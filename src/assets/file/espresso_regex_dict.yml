# Parse standard key=value pairs
kv_pair:
  regex: '(\w+)\s*=\s*([^,\n/=]+)'
  flags: ["g", "i", "m"]
# Parse Fortran indexed array syntax (e.g., celldm(1)=10.0, starting_magnetization(2)=0.5)
# regex keys above cannot match these because '(' follows the name instead of '='.
kv_pair_with_index:
  regex: '(\w+)\s*\(\s*(\d+)\s*\)\s*=\s*([^,\n/]+)'
  flags: ["g", "i", "m"]
# Captures generic namelist block content between &NAME and /; {{BLOCK_NAME}} is replaced at runtime.
namelist_block:
  regex: "&{{BLOCK_NAME}}\\s*([\\s\\S]*?)\\/"
  flags: ["i", "m"]
  params:
    BLOCK_NAME:
      - "CONTROL"
      - "SYSTEM"
      - "ELECTRONS"
      - "IONS"
      - "CELL"
      - "FCP"
      - "RISM"
# Parse CELL_PARAMETERS card and its matrix
cell_parameters_card:
  regex: !listToString
    - CELL_PARAMETERS\s* # Matches the card header "CELL_PARAMETERS" followed by optional whitespace.
    - '[{(]?\s*' # Matches an optional opening brace or parenthesis for the units, followed by optional whitespace.
    - '{{UNIT}}?' # Capturing group 1: Matches the unit string explicitly defined in params (optional, defaults to alat if missing per espresso docs, but we capture if present).
    - \s*[)}]?\s*\n # Matches optional whitespace, an optional closing brace/parenthesis, optional whitespace, and the required newline character.
    - ( # Start of capturing group 2: Matches the 3x3 matrix of cell vectors.
    - (?: # Start of the non-capturing group representing a single row of 3 numbers.
    - '[ \t]*{{NUMBER_FLOAT_FORTRAN}}' # Matches optional leading spaces/tabs and the first numeric value.
    - '[ \t]+{{NUMBER_FLOAT_FORTRAN}}' # Matches required spacing and the second numeric value.
    - '[ \t]+{{NUMBER_FLOAT_FORTRAN}}' # Matches required spacing and the third numeric value.
    - '[ \t]*\n?' # Matches optional trailing spaces/tabs and an optional newline.
    - ){3} # End of the non-capturing group, repeated exactly 3 times for the 3 lattice vectors.
    - ) # End of capturing group 2.
  flags: ["i"]
  params:
    UNIT:
      - alat
      - bohr
      - angstrom
