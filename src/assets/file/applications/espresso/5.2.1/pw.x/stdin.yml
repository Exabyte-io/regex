_fingerprints:
  - regex: "^&control"
    flags: ["g", "i"]
    isRequired: true
  - regex: "^&electrons"
    flags: ["g", "i"]
    isRequired: true

control:
  _format: !include src/assets/file/fortran_namelist.yml # matching generic namelist
  calculation:
    regex: calculation\s*=\s*'([^']+)'
    flags: [ "g", "m", "i" ]
  title:
    regex: title\s*=\s*'([^']+)'
    flags: [ "g", "m", "i" ]
  restart_mode:
    regex: restart_mode\s*=\s*'([^']+)'
    flags: [ "g", "m", "i" ]

# Single row of three Fortran floats (optional leading whitespace on the first value).
cell_parameters_row:
  regex: &cell_parameters_row !listToString
    - '[ \t]*(?P<x>{{NUMBER_FLOAT_FORTRAN}})' # First component
    - '[ \t]+(?P<y>{{NUMBER_FLOAT_FORTRAN}})' # Second component
    - '[ \t]+(?P<z>{{NUMBER_FLOAT_FORTRAN}})' # Third component
    - '[ \t]*\n?' # Optional trailing whitespace and newline

# Parse CELL_PARAMETERS card and its matrix
cell_parameters_card:
  regex: !listToString
    - 'CELL_PARAMETERS\s*' # Matches the card header "CELL_PARAMETERS" followed by optional whitespace.
    - '[{(]?\s*' # Matches an optional opening brace or parenthesis for the units, followed by optional whitespace.
    - '{{UNIT}}?' # Capturing group 1: Matches the unit string explicitly defined in params (optional, defaults to alat if missing per espresso docs, but we capture if present).
    - '\s*[)}]?\s*\n' # Matches optional whitespace, an optional closing brace/parenthesis, optional whitespace, and the required newline character.
    - '(' # Start of capturing group 2: Matches the 3x3 matrix of cell vectors.
    - '(?:' # Start of the non-capturing group representing a single row of 3 numbers.
    - *cell_parameters_row
    - '){3}' # End of the non-capturing group, repeated exactly 3 times for the 3 lattice vectors.
    - ')' # End of capturing group 2.
  flags: ["i"]
  params:
    UNIT:
      - alat
      - bohr
      - angstrom

# Single ATOMIC_POSITIONS row: atom symbol, coordinates, and optional constraints.
atomic_positions_row:
  regex: &atomic_positions_row !listToString
    - '[ \t]*(?P<symbol>\w+)' # Atom symbol
    - '[ \t]+(?P<x>{{NUMBER_FLOAT_FORTRAN}})' # X coordinate
    - '[ \t]+(?P<y>{{NUMBER_FLOAT_FORTRAN}})' # Y coordinate
    - '[ \t]+(?P<z>{{NUMBER_FLOAT_FORTRAN}})' # Z coordinate
    - '(?:(?:[ \t]+{{ESPRESSO_ATOMIC_CONSTRAINT}}){3})?[ \t]*\n?' # Optional 3 constraints (0 or 1) and optional newline

# Parse ATOMIC_POSITIONS card and its rows
atomic_positions_card:
  regex: !listToString
    - 'ATOMIC_POSITIONS\s*'
    - '[{(]?\s*'
    - '{{UNIT}}?'
    - '\s*[)}]?\s*\n'
    - '('
    - '(?:'
    - *atomic_positions_row
    - ')+' # One or more rows
    - ')'
  flags: ["i"]
  params:
    UNIT:
      - alat
      - bohr
      - angstrom
      - crystal
      - crystal_sg
