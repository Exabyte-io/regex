namelist:
    regex: !listToString
      - '(\$|&){{BLOCK_NAME}}\s*\n'
      # 1. OUTER group: repeats the whole key-value pair + comma combination
      - '(?:'
      # 2. INNER group: handles the OR logic between standard KV and indexed KV
      - '(?:\s*'
      - !include src/assets/file/shared.yml#/kv_pair/regex
      - '|\s*'
      - !include src/assets/file/shared.yml#/kv_pair_with_index/regex
      - ')' # closes the INNER group
      # 3. Consume the optional comma and whitespace
      - '\s*,?\s*'
      # 4. Close OUTER group and repeat zero or more times
      - ')*'
      - '\s*\/'
    flags: ["g", "i", "m"]
    params:
      BLOCK_NAME:
        - CONTROL
        - SYSTEM
        - ELECTRONS
        - IONS
        - CELL
        - FCP
        - RISM

